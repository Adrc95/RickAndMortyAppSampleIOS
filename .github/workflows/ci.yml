name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  unit-tests:
    name: "Unit tests"
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Run unit tests
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
              for d in devices:
                  if d['isAvailable'] and d['name'] == 'iPhone 16':
                      print(d['udid'])
                      sys.exit(0)
          for runtime, devices in data['devices'].items():
              for d in devices:
                  if d['isAvailable']:
                      print(d['udid'])
                      sys.exit(0)
          ")
          xcodebuild test \
            -project rickyandmorty.xcodeproj \
            -scheme rickyandmorty \
            -destination "id=$DEVICE_ID" \
            -only-testing:rickyandmortyTests \
            -resultBundlePath UnitTests.xcresult \
            | xcbeautify

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: UnitTests.xcresult
          retention-days: 7

  build:
    name: "Assemble debug app"
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Assemble debug
        run: |
          set -o pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
              for d in devices:
                  if d['isAvailable'] and d['name'] == 'iPhone 16':
                      print(d['udid'])
                      sys.exit(0)
          for runtime, devices in data['devices'].items():
              for d in devices:
                  if d['isAvailable']:
                      print(d['udid'])
                      sys.exit(0)
          ")
          xcodebuild build \
            -project rickyandmorty.xcodeproj \
            -scheme rickyandmorty \
            -destination "id=$DEVICE_ID" \
            -derivedDataPath build \
            | xcbeautify

      - name: Zip app
        run: |
          APP_PATH=$(find build -name "rickyandmorty.app" -type d | head -1)
          zip -r -y debug-app.zip "$APP_PATH"

      - name: Upload debug app
        uses: actions/upload-artifact@v4
        with:
          name: debug-app
          path: debug-app.zip
          retention-days: 7

  lint:
    name: "Static analysis SwiftLint"
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: |
          VERSION="0.57.0"
          curl -sL "https://github.com/realm/SwiftLint/releases/download/${VERSION}/portable_swiftlint.zip" -o swiftlint.zip
          unzip -o swiftlint.zip
          chmod +x swiftlint
          sudo mv swiftlint /usr/local/bin/swiftlint

      - name: SwiftLint
        run: swiftlint lint --strict

  ui-tests:
    name: "UI tests"
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Run UI tests
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
              for d in devices:
                  if d['isAvailable'] and d['name'] == 'iPhone 16':
                      print(d['udid'])
                      sys.exit(0)
          for runtime, devices in data['devices'].items():
              for d in devices:
                  if d['isAvailable']:
                      print(d['udid'])
                      sys.exit(0)
          ")
          xcodebuild test \
            -project rickyandmorty.xcodeproj \
            -scheme rickyandmorty \
            -destination "id=$DEVICE_ID" \
            -only-testing:rickyandmortyUITests \
            -resultBundlePath UITests.xcresult \
            | xcbeautify

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: UITests.xcresult
          retention-days: 7
